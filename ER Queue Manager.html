<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ER Queue Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f4;--panel:#fff;--ink:#14262b;--mute:#5b6f75;--line:#d3dee1;--accent:#0b6e7f;--on:#fff;
--t1:#c62828;--t2:#e8590c;--t3:#d9a400;--t4:#2e8b57;--t5:#3b78b5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b1e;--panel:#172a2f;--ink:#e8f1f2;--mute:#93a9ae;--line:#2a4248;--accent:#4fb8c9;--on:#0f1b1e}}
:root[data-theme="dark"]{--bg:#0f1b1e;--panel:#172a2f;--ink:#e8f1f2;--mute:#93a9ae;--line:#2a4248;--accent:#4fb8c9;--on:#0f1b1e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:1.25rem;margin:0}
.clock{color:var(--mute);font-size:.9rem}
.stats{display:flex;gap:20px;flex-wrap:wrap}
.stat b{display:block;font-size:1.5rem;line-height:1}
.stat span{font-size:.8rem;color:var(--mute)}
main{display:grid;grid-template-columns:minmax(260px,320px) 1fr;gap:16px;padding:16px 20px;max-width:1200px;margin:0 auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
h2{font-size:1rem;margin:0 0 12px}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px}.row>*{flex:1}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px}
button.primary{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:700;width:100%;margin-top:14px;padding:11px}
button.small{padding:5px 9px;font-size:.85rem}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.levels input{position:absolute;opacity:0;width:0}
.levels label{margin:0;text-align:center;padding:8px 2px;border-radius:6px;border:2px solid var(--line);cursor:pointer;color:var(--ink);font-size:.8rem;line-height:1.2}
.levels label b{display:block;font-size:1.1rem}
.levels input:checked+label{border-color:var(--c);background:var(--c);color:#fff}
.levels input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
.hint{font-size:.8rem;color:var(--mute);margin-top:6px;min-height:1.2em}
.bays{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.bay{border:1px dashed var(--line);border-radius:8px;padding:10px;min-height:92px}
.bay.busy{border-style:solid;border-left:6px solid var(--c)}
.bay small{color:var(--mute)}
.card{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.badge{width:44px;height:44px;border-radius:8px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.2rem}
.name{font-weight:700}.meta{font-size:.85rem;color:var(--mute)}
.wait{font-weight:700}.over{color:var(--t1)}
.tag{display:inline-block;font-size:.75rem;padding:1px 7px;border-radius:99px;background:var(--t1);color:#fff;margin-left:6px}
.empty{color:var(--mute);padding:14px 0}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.top button.primary{width:auto;margin:0}
</style>
</head>
<body>
<header>
  <div><h1>Emergency Department Queue</h1><div class="clock" id="clock"></div></div>
  <div class="stats">
    <div class="stat"><b id="sWait">0</b><span>Waiting</span></div>
    <div class="stat"><b id="sBusy">0</b><span>In treatment</span></div>
    <div class="stat"><b id="sAvg">0 min</b><span>Average wait</span></div>
    <div class="stat"><b id="sDone">0</b><span>Discharged</span></div>
  </div>
</header>
<main>
  <section aria-labelledby="regH">
    <h2 id="regH">Register patient</h2>
    <label for="name">Patient name</label><input id="name" autocomplete="off">
    <div class="row">
      <div><label for="age">Age</label><input id="age" type="number" min="0" max="120"></div>
      <div><label for="sex">Sex</label><select id="sex"><option>Female</option><option>Male</option><option>Other</option></select></div>
    </div>
    <label for="cc">Chief complaint</label><textarea id="cc" rows="2"></textarea>
    <label id="lvLabel">Triage level</label>
    <div class="levels" role="radiogroup" aria-labelledby="lvLabel" id="levels"></div>
    <div class="hint" id="lvHint"></div>
    <button class="primary" id="add">Add to queue</button>
    <div class="hint" id="msg" role="status"></div>
    <button class="small" id="demo" style="margin-top:10px">Load sample patients</button>
    <button class="small" id="reset" style="margin-top:10px">Clear all</button>
  </section>

  <div>
    <section style="margin-bottom:16px">
      <div class="top"><h2 style="margin:0">Treatment bays</h2><button class="primary" id="next">Call next patient</button></div>
      <div class="bays" id="bays"></div>
    </section>
    <section>
      <h2>Waiting queue <span class="meta">(most urgent first, then earliest arrival)</span></h2>
      <div id="queue"></div>
    </section>
  </div>
</main>

<script>
const LEVELS={1:{n:"Resuscitation",limit:0,d:"Immediate life-saving action needed"},2:{n:"Emergent",limit:10,d:"High risk, should not wait; treat within 10 min"},3:{n:"Urgent",limit:30,d:"Stable but needs several resources; within 30 min"},4:{n:"Less urgent",limit:60,d:"One resource needed; within 60 min"},5:{n:"Non-urgent",limit:120,d:"No resources needed; within 120 min"}};
const BAYS=5;
let S={next:1,patients:[],bays:Array(BAYS).fill(null),done:[]};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mins=t=>Math.floor((Date.now()-t)/60000);

function save(){try{localStorage.setItem("er-queue",JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem("er-queue");if(r)S=JSON.parse(r)}catch(e){}}

// triage level picker
$("levels").innerHTML=Object.keys(LEVELS).map(l=>`<input type="radio" name="lv" id="lv${l}" value="${l}" ${l==3?"checked":""}><label for="lv${l}" style="--c:var(--t${l})"><b>${l}</b>${LEVELS[l].n}</label>`).join("");
function hint(){const v=document.querySelector('input[name=lv]:checked').value;$("lvHint").textContent=LEVELS[v].d}
$("levels").addEventListener("change",hint);hint();

function add(p){p.id=S.next++;p.arrived=p.arrived||Date.now();S.patients.push(p);save();render()}
$("add").onclick=()=>{
  const name=$("name").value.trim(),cc=$("cc").value.trim(),age=$("age").value;
  if(!name||!cc||age===""){$("msg").textContent="Enter name, age and chief complaint to add the patient.";return}
  add({name,age:+age,sex:$("sex").value,cc,level:+document.querySelector('input[name=lv]:checked').value});
  $("name").value=$("age").value=$("cc").value="";$("msg").textContent=name+" added to the queue.";$("name").focus()
};
function sorted(){return [...S.patients].sort((a,b)=>a.level-b.level||a.arrived-b.arrived)}
function callNext(){
  const free=S.bays.indexOf(null),q=sorted();
  if(free<0){$("msg").textContent="All bays are occupied. Discharge a patient to free a bay.";return}
  if(!q.length){$("msg").textContent="No patients are waiting.";return}
  const p=q[0];S.patients=S.patients.filter(x=>x.id!==p.id);
  p.waited=mins(p.arrived);p.started=Date.now();S.bays[free]=p;save();render()
}
$("next").onclick=callNext;
function discharge(i){const p=S.bays[i];p.ended=Date.now();S.done.push({id:p.id,waited:p.waited,level:p.level});S.bays[i]=null;save();render()}
function remove(id){S.patients=S.patients.filter(x=>x.id!==id);save();render()}
function bump(id,d){const p=S.patients.find(x=>x.id===id);p.level=Math.min(5,Math.max(1,p.level+d));save();render()}

function render(){
  const q=sorted(),busy=S.bays.filter(Boolean).length;
  const waits=S.done.map(d=>d.waited).concat(S.bays.filter(Boolean).map(b=>b.waited));
  $("sWait").textContent=q.length;$("sBusy").textContent=busy+"/"+BAYS;$("sDone").textContent=S.done.length;
  $("sAvg").textContent=(waits.length?Math.round(waits.reduce((a,b)=>a+b,0)/waits.length):0)+" min";
  $("clock").textContent=new Date().toLocaleString([], {weekday:"short",hour:"2-digit",minute:"2-digit"});
  $("bays").innerHTML=S.bays.map((p,i)=>p?`<div class="bay busy" style="--c:var(--t${p.level})"><small>Bay ${i+1}</small><div class="name">${esc(p.name)}</div><div class="meta">Level ${p.level} · ${esc(p.cc)}</div><div class="meta">In bay ${mins(p.started)} min</div><button class="small" data-d="${i}" style="margin-top:6px">Discharge</button></div>`:`<div class="bay"><small>Bay ${i+1}</small><div class="empty">Free</div></div>`).join("");
  $("queue").innerHTML=q.length?q.map((p,i)=>{const w=mins(p.arrived),over=w>LEVELS[p.level].limit;
    return `<div class="card"><div class="badge" style="--c:var(--t${p.level})" title="${LEVELS[p.level].n}">${p.level}</div>
    <div><div class="name">${i+1}. ${esc(p.name)}, ${p.age} ${esc(p.sex[0])}${over?'<span class="tag">Over target</span>':""}</div><div class="meta">${esc(p.cc)}</div></div>
    <div class="actions"><span class="wait ${over?"over":""}">${w} min</span>
    <button class="small" data-u="${p.id}" aria-label="Raise urgency of ${esc(p.name)}">Raise</button>
    <button class="small" data-l="${p.id}" aria-label="Lower urgency of ${esc(p.name)}">Lower</button>
    <button class="small" data-r="${p.id}" aria-label="Remove ${esc(p.name)}">Remove</button></div></div>`}).join(""):`<div class="empty">No one is waiting. New patients appear here after registration.</div>`
}
document.addEventListener("click",e=>{const t=e.target.dataset;if(!t)return;
  if(t.d!==undefined)discharge(+t.d);else if(t.u)bump(+t.u,-1);else if(t.l)bump(+t.l,1);else if(t.r)remove(+t.r)});
$("demo").onclick=()=>{[["Ravi Kumar",58,"Male","Chest pain, sweating",2,25],["Sunita Devi",34,"Female","Sprained ankle",5,50],["Aman Verma",7,"Male","High fever, vomiting",3,35],["Meera Singh",71,"Female","Difficulty breathing",2,12],["Imran Khan",29,"Male","Deep cut on forearm",4,40],["Unknown patient",45,"Male","Unconscious after road accident",1,2]].forEach(([name,age,sex,cc,level,ago])=>add({name,age,sex,cc,level,arrived:Date.now()-ago*60000}))};
$("reset").onclick=()=>{if(confirm("Clear all patients and bays?")){S={next:1,patients:[],bays:Array(BAYS).fill(null),done:[]};save();render()}};
load();render();setInterval(render,30000);
</script>
</body>
</html>
